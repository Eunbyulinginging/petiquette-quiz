<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffb7c8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="펫티켓 퀴즈"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>몽글몽글 펫티켓 퀴즈</title><style>
:root{font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#624d60;background:#fff6ed}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 15%,#ffe1eb 0 12%,transparent 13%),radial-gradient(circle at 90% 82%,#e1f6e9 0 13%,transparent 14%),#fff8ef}.wrap{max-width:650px;margin:auto;padding:25px 18px 50px;text-align:center}.brand{font-size:14px;font-weight:800;color:#c97691;letter-spacing:2px}.pets{font-size:65px;margin:8px 0;filter:drop-shadow(0 7px 2px #f6d5c7)}h1{font-size:clamp(28px,7vw,40px);margin:6px 0 8px;color:#9e6380}p{line-height:1.65}.sub{color:#9a8792;margin:0 0 24px}.card{background:#fff;border:3px solid #ffdeea;border-radius:30px;box-shadow:0 12px 0 #f8e7e1,0 16px 25px #bd9f9920;padding:26px 20px;margin:18px 0}.tag{display:inline-block;border-radius:30px;background:#fce7f0;color:#ad6786;padding:8px 17px;font-size:14px;font-weight:800}.question{font-size:clamp(21px,5vw,27px);font-weight:850;line-height:1.55;margin:25px 0}.options{display:grid;gap:12px}.btn{border:0;border-radius:20px;padding:17px 18px;background:#ffd6e3;color:#89576f;font:inherit;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 5px 0 #e8b5c5;transition:transform .12s}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #e8b5c5}.btn.primary{background:#ff91b1;color:#fff;box-shadow:0 5px 0 #df6e91}.btn.mint{background:#c9f1df;box-shadow:0 5px 0 #a3d9bd}.btn.selected{outline:3px solid #ff86a9;background:#ffe6ef}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{background:#f2fff7;border:2px dashed #a9dfbe;border-radius:20px;padding:17px;margin-top:20px;line-height:1.7;text-align:left;white-space:pre-line}.result strong{color:#4e9971}.small{font-size:13px;color:#a38f99}.hide{display:none}.foot{margin-top:30px}.progress{font-size:14px;color:#aa7d92;font-weight:700}.dec{font-size:25px}button:focus-visible{outline:4px solid #9562bd;outline-offset:3px}@media(max-width:400px){.card{padding:20px 14px}.btn{font-size:15px}}
</style></head><body><main class="wrap"><div class="brand">♡ 우리 함께 지켜요 ♡</div><div class="pets" aria-hidden="true">🐶🐱🐾</div><h1>몽글몽글<br>펫티켓 퀴즈</h1><p class="sub">동물도 행복하고, 이웃도 행복한 우리 마을 🌷</p><div class="card" id="start"><div class="dec">🌼 🦴 🌼</div><h2>준비됐나요?</h2><p>8개의 문제 중 하나를 뽑아<br>펫티켓 박사가 되어 보아요!</p><button class="btn primary" id="startBtn">🎁 랜덤 문제 뽑기</button><p class="small">인터넷 없이도 퀴즈를 즐길 수 있어요.</p></div><section class="card hide" id="game" aria-live="polite"><div class="progress" id="progress"></div><span class="tag" id="type"></span><div class="question" id="question"></div><div class="options" id="options"></div><div id="result" class="result hide"></div><div class="two" style="margin-top:23px"><button class="btn mint" id="answerBtn">💡 정답 보기</button><button class="btn primary" id="nextBtn">🎲 다음 문제</button></div></section><div class="foot small">🐾 작은 배려가 만드는 행복한 마을 🐾</div></main><script>
const questions=[
{type:'O/X 퀴즈',q:'내가 동물과 함께 살게 되면, 내가 주인이기 때문에 동물에게 막 대해도 된다.',options:['⭕ O','❌ X'],correct:1,answer:'정답: X',explain:'동물도 소중한 생명이에요. 언제나 사랑과 존중으로 대해 주세요.'},
{type:'객관식 퀴즈',q:'다른 사람들이 불편하지 않도록 동물과 함께 사는 사람들이 지켜야 하는 규칙을 무엇이라고 할까요?',options:['① 애니멀로','② 먹이사슬','③ 펫티켓','④ 에티켓'],correct:2,answer:'정답: ③ 펫티켓',explain:'펫티켓은 반려동물과 함께 생활할 때 지켜야 할 예절이에요.'},
{type:'생각 말하기',q:'펫티켓을 왜 존중해야 하나요?',answer:'예시 답: 여러 사람들이 불쾌함과 불편함을 느낄 수 있기 때문이에요.',explain:'서로를 배려하면 사람과 동물이 모두 행복하게 지낼 수 있어요.'},
{type:'O/X 퀴즈',q:'펫티켓은 강아지를 키우는 사람만 지켜야 한다.',options:['⭕ O','❌ X'],correct:1,answer:'정답: X',explain:'강아지뿐 아니라 반려동물을 키우는 모든 사람이 지켜야 해요.'},
{type:'생각 말하기',q:'펫티켓을 지키는 구체적인 상황을 말해 보세요.',answer:'예시 답:\n• 산책할 때 배변 봉투 가지고 다니기\n• 산책할 때 목줄 꼭 하기\n• 지나가는 사람에게 개가 함부로 가까이 가지 않도록 하기',explain:'일상 속 작은 실천이 중요해요.'},
{type:'주관식 퀴즈',q:'펫티켓은 어떤 사람들이 지켜야 할까요?',answer:'정답: 반려동물을 키우는 모든 사람',explain:'반려동물의 종류와 관계없이 보호자 모두가 지켜야 해요.'},
{type:'O/X 퀴즈',q:'공원에서 귀여운 강아지를 만났어요. 강아지가 귀여우니까 보호자에게 물어보지 않고 바로 만져도 된다.',options:['⭕ O','❌ X'],correct:1,answer:'정답: X',explain:'강아지가 놀라거나 무서워할 수 있어요. 보호자에게 먼저 허락을 구해요.'},
{type:'객관식 퀴즈',q:'반려견과 산책할 때 올바른 행동은 무엇일까요?',options:['① 사람이 없으면 배설물을 치우지 않는다.','② 다른 사람이 무서워해도 가까이 가게 둔다.','③ 마음껏 뛰도록 목줄을 풀어 준다.','④ 배설물은 봉투에 담아 정해진 장소에 버린다.'],correct:3,answer:'정답: ④',explain:'배설물을 바로 치워서 모두가 사용하는 공간을 깨끗하게 지켜요.'}
];let remaining=[],current=-1,chosen=-1;const $=id=>document.getElementById(id);function next(){if(!remaining.length)remaining=questions.map((_,i)=>i).filter(i=>i!==current);const ix=Math.floor(Math.random()*remaining.length);current=remaining.splice(ix,1)[0];chosen=-1;const q=questions[current];$('start').classList.add('hide');$('game').classList.remove('hide');$('progress').textContent='🐾 8가지 문제 중 랜덤 도전!';$('type').textContent=q.type;$('question').textContent=q.q;$('result').classList.add('hide');$('answerBtn').textContent='💡 정답 보기';$('options').replaceChildren();if(q.options){q.options.forEach((v,i)=>{let b=document.createElement('button');b.className='btn';b.textContent=v;b.onclick=()=>{chosen=i;document.querySelectorAll('#options button').forEach((x,j)=>x.classList.toggle('selected',j===i))};$('options').appendChild(b)})}else{let t=document.createElement('p');t.textContent='💭 내 생각을 먼저 말해 보세요!';$('options').appendChild(t)}}function answer(){const q=questions[current];$('result').classList.remove('hide');$('result').replaceChildren();const h=document.createElement('strong');h.textContent=q.answer;$('result').appendChild(h);const p=document.createElement('div');p.textContent='🌷 '+q.explain;$('result').appendChild(p);if(q.options&&chosen>=0){let x=document.createElement('p');x.textContent=chosen===q.correct?'🎉 정답이에요! 참 잘했어요!':'🌱 괜찮아요! 정답을 배우면 더 멋진 펫티켓 박사가 될 수 있어요.';$('result').prepend(x)}$('answerBtn').textContent='💖 정답 확인 완료'}$('startBtn').onclick=next;$('nextBtn').onclick=next;$('answerBtn').onclick=answer;if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
